name: Build iOS

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Sincronizar Capacitor
        run: npx cap sync ios

      - name: Resolver pacotes Swift
        run: |
          cd ios/App
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj

      - name: Compilar iOS
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compactar aplicativo
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          zip -r FutebolProjeto-iOS.zip App.app

      - name: Salvar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: FutebolProjeto-iOS
          path: ios/App/build/Build/Products/Release-iphoneos/FutebolProjeto-iOS.zip
